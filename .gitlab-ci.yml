# .gitlab-ci.yml
# Konfigurasi untuk menjalankan Katalon Studio tests di GitLab CI
# dengan Chrome dan Firefox (headless) yang sudah disamarkan agar tidak terdeteksi sebagai bot.

image:
  name: 'katalonstudio/katalon:11.1.3'
  entrypoint: [""]

stages:
  - test

variables:
  # Agar job tetap lanjut meskipun salah satu browser gagal
  CONTINUE_ON_FAILURE: "true"
  # Alokasi memori untuk menghindari Out of Memory pada headless browser
  GS_OPTIONS: "-Xmx2048m -Xms512m -Djava.shm.size=2g"

katalon_digiboxkh_test:
  stage: test
  tags:
    - infra
  timeout: 12h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  
  before_script:
    # Bersihkan folder Reports dan Screenshot dari sisa pipeline sebelumnya
    - rm -rf Reports/* Screenshot/* || true
    # Update apt (abaikan error repository Edge)
    - apt-get update -o Acquire::AllowInsecureRepositories=true -o Doomsday::Ignore=true -y || true
    # Install ffmpeg untuk video recording
    - apt-get install -y --allow-unauthenticated ffmpeg
    - ffmpeg -version

  script:
    - curl ifconfig.me
    - |
      # --- PATH RESOLUTION ---
      if [ -z "$TEST_PATH" ]; then
        echo "Menjalankan full regression collection default..."
        export FINAL_PATH="Test Suites/WEB/Web_Test_Suite_Collection/Regression_Digiboxkh_Web"
        export ARG_TYPE="-testSuiteCollectionPath"
      else
        echo "Menjalankan custom test: $TEST_PATH"
        export FINAL_PATH=$(echo "$TEST_PATH" | cut -d'=' -f2)
        export ARG_TYPE=$(echo "$TEST_PATH" | cut -d'=' -f1)
      fi

      # ============================================================
      # 1. Chrome (Headless) dengan anti-detection arguments
      # ============================================================
      echo "=========================================="
      echo "Memulai Eksekusi 1/2: Chrome (Headless)"
      echo "=========================================="
      katalonc.sh -noSplash -runMode=console \
        -projectPath="$CI_PROJECT_DIR/digibox-kh.prj" \
        -retry=0 -apiKey="$KATALON_API_KEY" \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Chrome (headless)" \
        -reportFolder="Reports/Chrome_Reports" \
        -reportFileName="Chrome_Report" \
        --config \
        -webui.autoUpdateDrivers=true \
        -webui.chrome.args="--disable-blink-features=AutomationControlled --user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36 --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=1920,1080" \
        || echo "Chrome tests selesai (dengan beberapa kegagalan)."

      # ============================================================
      # 2. Firefox (Headless) dengan anti-detection preferences
      # ============================================================
      echo "=========================================="
      echo "Memulai Eksekusi 2/2: Firefox (Headless)"
      echo "=========================================="
      katalonc.sh -noSplash -runMode=console \
        -projectPath="$CI_PROJECT_DIR/digibox-kh.prj" \
        -retry=0 -apiKey="$KATALON_API_KEY" \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Firefox (headless)" \
        -reportFolder="Reports/Firefox_Reports" \
        -reportFileName="Firefox_Report" \
        --config \
        -webui.autoUpdateDrivers=true \
        -webui.firefox.args="-headless -width 1920 -height 1080" \
        -webui.firefox.preferences="dom.webdriver.enabled=false; useAutomationExtension=false" \
        || echo "Firefox tests selesai (dengan beberapa kegagalan)."

    # --- Cleanup file video lama (opsional) ---
    - echo "Membersihkan file video lama (>30 hari)..."
    - find Reports/ -type f -name "*.mp4" -mtime +30 -exec rm -f {} \; || true
    - find Screenshot/ -type f -name "*.mp4" -mtime +30 -exec rm -f {} \; || true

  artifacts:
    when: always
    paths:
      - Reports/
      - Screenshot/   # Menyimpan screenshot dan HTML source dari AutoScreenshotListener
    expire_in: 2 mos