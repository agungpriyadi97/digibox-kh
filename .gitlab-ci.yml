```yaml
image:
  name: katalonstudio/katalon:11.1.3
  entrypoint: [""]

stages:
  - test

variables:
  # JVM Memory
  _JAVA_OPTIONS: "-Xms512m -Xmx2048m"

  # Chrome / Firefox stability in Docker Linux
  KATALON_OPTS: >
    --config
    -webui.autoUpdateDrivers=true

  # Default suite collection path
  TEST_SUITE_COLLECTION: "Test Suites/WEB/Web_Test_Suite_Collection/Regresstion_Digiboxh_Web"

katalon_digibox_test:
  stage: test

  tags:
    - infra

  timeout: 12h

  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push"

  before_script:
    # Install dependencies
    - apt-get update -y || true

    # Firefox dependency
    - apt-get install -y wget curl unzip ffmpeg

    # Debugging
    - echo "===== SYSTEM INFO ====="
    - java -version
    - pwd
    - ls
    - find . -name "*.tsc"
    - find . -name "*.ts"

    # Public IP
    - echo "===== RUNNER IP ====="
    - curl ifconfig.me || true

  script:
    - |
      echo "======================================"
      echo "START KATALON EXECUTION"
      echo "======================================"

      echo "Using Suite Collection:"
      echo "$TEST_SUITE_COLLECTION"

      echo "======================================"
      echo "RUN CHROME HEADLESS"
      echo "======================================"

      katalonc.sh \
      -noSplash \
      -runMode=console \
      -projectPath="$CI_PROJECT_DIR/digibox-kh.prj" \
      -retry=0 \
      -apiKey="$KATALON_API_KEY" \
      -testSuiteCollectionPath="$TEST_SUITE_COLLECTION" \
      -browserType="Chrome (headless)" \
      -reportFolder="Reports/Chrome_Reports" \
      -reportFileName="Chrome_Report" \
      --config \
      -webui.autoUpdateDrivers=true \
      -chrome.args="--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1920,1080" \
      || echo "Chrome execution failed"

      echo "======================================"
      echo "RUN FIREFOX HEADLESS"
      echo "======================================"

      katalonc.sh \
      -noSplash \
      -runMode=console \
      -projectPath="$CI_PROJECT_DIR/digibox-kh.prj" \
      -retry=0 \
      -apiKey="$KATALON_API_KEY" \
      -testSuiteCollectionPath="$TEST_SUITE_COLLECTION" \
      -browserType="Firefox (headless)" \
      -reportFolder="Reports/Firefox_Reports" \
      -reportFileName="Firefox_Report" \
      --config \
      -webui.autoUpdateDrivers=true \
      || echo "Firefox execution failed"

      echo "======================================"
      echo "EXECUTION FINISHED"
      echo "======================================"

  after_script:
    - echo "Cleaning old video artifacts..."
    - find Reports/ -type f -name "*.mp4" -mtime +30 -exec rm -f {} \; || true

  artifacts:
    when: always

    paths:
      - Reports/

    expire_in: 2 mos
```