image:
  name: 'katalonstudio/katalon:11.1.3'
  entrypoint: [""]

stages:
  - test

variables:
  CONTINUE_ON_FAILURE: "true"
  GS_OPTIONS: "-Xmx2048m -Xms512m -Djava.shm.size=2g"

katalon_mapclub_test:
  stage: test

  tags:
    - infra

  timeout: 12h

  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

  before_script:
    - apt-get update -o Acquire::AllowInsecureRepositories=true -o Doomsday::Ignore=true -y || true
    - apt-get install -y --allow-unauthenticated ffmpeg
    - ffmpeg -version

  script:

    - mkdir -p Videos
    - mkdir -p Reports
    - mkdir -p Screenshot

    - |
      if [ -z "$TEST_PATH" ]; then
        echo "Running default Regression Collection..."
        export FINAL_PATH="Test Suites/WEB/Web_Test_Suite_Collection/Regression_Digiboxkh_Web"
        export ARG_TYPE="-testSuiteCollectionPath"
      else
        echo "Running custom test: $TEST_PATH"
        export FINAL_PATH=$(echo "$TEST_PATH" | cut -d'=' -f2)
        export ARG_TYPE=$(echo "$TEST_PATH" | cut -d'=' -f1)
      fi

    # ==========================
    # CHROME EXECUTION + VIDEO
    # ==========================

    - echo "Starting Chrome recording..."

    - |
      ffmpeg \
      -y \
      -video_size 1920x1080 \
      -framerate 25 \
      -f x11grab \
      -i :99.0 \
      -codec:v libx264 \
      -preset ultrafast \
      -crf 32 \
      -pix_fmt yuv420p \
      Videos/chrome_execution.mp4 > /dev/null 2>&1 &

      export FFMPEG_PID=$!

    - sleep 3

    - echo "Running Chrome test..."

    - |
      katalonc.sh -noSplash -runMode=console \
        -projectPath="$CI_PROJECT_DIR/Automation digibox-kh.prj" \
        -retry=0 \
        -apiKey="$KATALON_API_KEY" \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Chrome (headless)" \
        -reportFolder="Reports/Chrome_Reports" \
        -reportFileName="Chrome_Report" \
        --config -webui.autoUpdateDrivers=true || true

    - echo "Stopping Chrome recording..."

    - kill -INT $FFMPEG_PID || true

    - sleep 5

    # ==========================
    # FIREFOX EXECUTION + VIDEO
    # ==========================

    - echo "Starting Firefox recording..."

    - |
      ffmpeg \
      -y \
      -video_size 1920x1080 \
      -framerate 25 \
      -f x11grab \
      -i :99.0 \
      -codec:v libx264 \
      -preset ultrafast \
      -crf 32 \
      -pix_fmt yuv420p \
      Videos/firefox_execution.mp4 > /dev/null 2>&1 &

      export FFMPEG_PID=$!

    - sleep 3

    - echo "Running Firefox test..."

    - |
      katalonc.sh -noSplash -runMode=console \
        -projectPath="$CI_PROJECT_DIR/Automation digibox-kh.prj" \
        -retry=0 \
        -apiKey="$KATALON_API_KEY" \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Firefox (headless)" \
        -reportFolder="Reports/Firefox_Reports" \
        -reportFileName="Firefox_Report" \
        --config -webui.autoUpdateDrivers=true || true

    - echo "Stopping Firefox recording..."

    - kill -INT $FFMPEG_PID || true

    - sleep 5

    # Cleanup old files
    - find Videos/ -type f -name "*.mp4" -mtime +30 -exec rm -f {} \; || true
    - find Screenshot/ -type f -name "*.png" -mtime +30 -exec rm -f {} \; || true

  artifacts:
    when: always

    paths:
      - Reports/
      - Screenshot/
      - Videos/

    expire_in: 2 mos